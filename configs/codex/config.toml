#:schema https://developers.openai.com/codex/config-schema.json

# 默认模型；常见选择有 gpt-6-astra、gpt-6-sol、gpt-6-luna，其他可用模型以当前目录为准。
model = "gpt-6-astra"

# 指定 872000 token 的上下文窗口；按 95% 有效比例，界面约显示 828K。
model_context_window = 872000

# Astra 可选 low、medium、high、xhigh、max；默认用 medium 平衡效果与响应速度。
model_reasoning_effort = "medium"

# 可选 default（标准）或 fast（加速）；其他档位以模型目录为准。需要时可临时开启 /fast。
service_tier = "default"

# 可选 auto、concise、detailed、none；使用 concise 输出简短推理摘要。
model_reasoning_summary = "auto"

# 可选 low、medium、high；使用 low 减少冗余输出，模型支持时生效。
model_verbosity = "low"

# 可选 file、keyring、auto、ephemeral；使用 file 保存凭据，便于插件和 CLI 共享。
cli_auth_credentials_store = "file"

# 可选 on-request、never 或 granular 细分策略；使用 on-request 按需发起审批。
approval_policy = "on-request"

# 可选 user、auto_review；使用 auto_review 审核符合条件的审批请求。
approvals_reviewer = "auto_review"

# 可选 read-only、workspace-write、danger-full-access；使用 workspace-write 读写当前 workspace。
sandbox_mode = "workspace-write"

# 可选 disabled、cached、indexed、live；使用 live 获取实时网页资料。
web_search = "live"

# 单条工具输出写入会话历史时的 token 预算；长日志可按需重跑或截取。
tool_output_token_limit = 8000

# 后台终端空轮询最长等待 600000 毫秒（10 分钟），适合较慢的测试和构建。
background_terminal_max_timeout = 600000

# 可选 save-all、none；使用 save-all 保存会话历史，便于恢复和排查。
history.persistence = "save-all"

# 将本地历史文件上限设为 104857600 字节（100 MiB）。
history.max_bytes = 104857600

# 回合结束时调用指定命令并传入通知 JSON；数组依次填写命令路径和参数。
notify = ["/Users/lilinze/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[sandbox_workspace_write]
# 可选 true、false；true 允许 workspace-write 沙盒内的 shell 命令访问外网。
network_access = true

# 在当前 workspace 外额外允许写入 /tmp；可按需列出其他路径。
writable_roots = ["/tmp"]

[tools.web_search]
# 搜索上下文可选 low、medium、high；使用 medium，搜索模式仍由顶层 web_search 指定。
context_size = "medium"

[agents]
# 最多同时运行 3 个子 agent thread，不含根 agent。
max_concurrent_threads_per_session = 3

[mcp_servers.openaiDeveloperDocs]
# 官方 OpenAI/Codex 文档 MCP 地址，用于查询最新配置、模型和 API 文档。
url = "https://developers.openai.com/mcp"

# 可选 true、false；false 表示文档 MCP 初始化失败时不阻止 Codex 启动。
required = false

# MCP 启动和单次工具调用的超时，单位为秒。
startup_timeout_sec = 20
tool_timeout_sec = 120
