#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-sol"

# 使用 Codex 模型目录声明的扩展上下文上限；按 95% 有效比例，界面约显示 828K。
model_context_window = 872000

# 默认使用较高 reasoning effort，适合复杂编码和调试任务。
model_reasoning_effort = "high"

# 默认使用标准服务档位，不额外消耗 Fast mode credits；需要加速时可在会话中临时开启 /fast。
service_tier = "default"

# 支持 reasoning summary 的模型输出简短推理摘要，便于回看关键判断。
model_reasoning_summary = "concise"

# 默认使用较低输出详细度，减少冗余说明和 output token 消耗；复杂任务可在 prompt 中临时要求展开。
model_verbosity = "low"

# 使用文件方式保存 Codex 登录凭据，便于 VS Code 插件和 CLI 共享 ~/.codex/auth.json。
cli_auth_credentials_store = "file"

# 需要越过沙盒边界时按需发起审批。
approval_policy = "on-request"

# 将符合条件的审批请求交给自动 Reviewer，避免弹出人工确认。
approvals_reviewer = "auto_review"

# 允许读写当前 workspace，适合日常编码；不会给出全盘写权限。
sandbox_mode = "workspace-write"

# 默认使用实时网页搜索，获取最新资料。
web_search = "live"

# 单条工具输出写入会话历史时的 token 预算；长日志可按需针对性重跑或截取。
tool_output_token_limit = 8000

# 后台终端空轮询最长等待 10 分钟，适合较慢的测试、构建和服务启动。
background_terminal_max_timeout = 600000

# 保存会话历史，便于恢复上下文和排查之前的操作。
history.persistence = "save-all"

# 限制本地历史文件体积，避免长期使用后无限增长；当前为 100 MiB。
history.max_bytes = 104857600

notify = ["/Users/lilinze/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[sandbox_workspace_write]
# 允许 workspace-write 沙盒内的 shell 命令直接访问外网。
network_access = true

# 除当前 workspace 外，额外允许写入 /tmp，方便测试、构建和临时产物。
writable_roots = ["/tmp"]

[features]
# 禁用跨会话 Memories，避免 Codex 保存或复用本地记忆上下文。
memories = false

[tools.web_search]
# 保持 top-level web_search = "live"，搜索结果上下文保持中等，避免资料类问题信息不足。
context_size = "medium"

[agents]
# 最多同时运行 3 个子 agent thread，不含根 agent。
max_concurrent_threads_per_session = 3

# V1 multi-agent 最多派生一层子 agent；V2 不使用此设置。
max_depth = 1

[mcp_servers.openaiDeveloperDocs]
# 官方 OpenAI/Codex 文档 MCP，用于查询最新配置、模型和 API 文档。
url = "https://developers.openai.com/mcp"

# 文档 MCP 不作为启动硬依赖，避免网络或服务异常导致 Codex 无法启动。
required = false

# 官方文档 MCP 偶尔冷启动或长页面读取较慢，适当放宽超时。
startup_timeout_sec = 20
tool_timeout_sec = 120

# 项目级信任设置，覆盖全局配置；路径必须绝对且唯一，支持文件系统和 IDE 虚拟路径。
