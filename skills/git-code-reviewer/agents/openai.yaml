interface:
  display_name: "Git Code Reviewer"
  short_description: "审查 Web 前端、Python 后端及联动改动的完整分支或暂存区"
  default_prompt: "Use $git-code-reviewer to review my staged changes or the complete branch against my explicit base ref. If the mode is unclear, ask which I want. Follow the affected Web frontend and Python backend paths and report findings and optional improvements without editing code."
policy:
  allow_implicit_invocation: false
