interface:
  display_name: "Git Checkout Branch"
  short_description: "基于当前真实 diff 推荐分支名，按 Skill 确认规则从当前 HEAD 切出新分支"
  default_prompt: "Use $git-checkout-branch to inspect the current branch and real diff, recommend a branch name for the dominant change, and create it from the current HEAD while preserving uncommitted changes. Do not ask for a base branch; follow the skill's confirmation requirements and reuse valid approval."
